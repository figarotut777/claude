name: FridgeChef

options:
  bundleIdPrefix: com.fridgechef
  deploymentTarget:
    macOS: "14.0"

settings:
  SWIFT_VERSION: 5.9

targets:
  FridgeChef:
    type: application
    platform: macOS
    sources:
      - FridgeChef
    info:
      path: FridgeChef/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: 1.0
        CFBundleVersion: 1
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2025. All rights reserved.
        NSPrincipalClass: NSApplication
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fridgechef.FridgeChef
      PRODUCT_NAME: FridgeChef
      INFOPLIST_FILE: FridgeChef/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: true
      SWIFT_VERSION: 5.9
      MACOSX_DEPLOYMENT_TARGET: 14.0
      DEVELOPMENT_TEAM: ""
