<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WB Analytics</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <!-- Боковое меню -->
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-icon">📊</span>
            <h2>WB Analytics</h2>
        </div>

        <nav class="nav">
            <a href="#analytics" class="nav-item active">
                <span class="nav-icon">📊</span>
                <span>Внутренняя аналитика</span>
            </a>
            <a href="#products" class="nav-item">
                <span class="nav-icon">🛒</span>
                <span>Товары</span>
            </a>
        </nav>
    </aside>

    <!-- Основной контент -->
    <main class="content">
        <header class="header">
            <h1>Внутренняя аналитика</h1>
            <span class="last-sync" id="lastSync">-</span>
        </header>

        <!-- Фильтры периодов -->
        <div class="filters">
            <div class="period-tabs">
                <button class="period-tab" data-period="today">Сегодня</button>
                <button class="period-tab" data-period="week">Неделя</button>
                <button class="period-tab active" data-period="month">Месяц</button>
                <button class="period-tab" data-period="custom" id="btnCustomPeriod">Свой период</button>
            </div>

            <div class="date-range" id="customDateRange" style="display: none;">
                <input type="date" id="dateFrom" class="date-input">
                <span class="date-sep">—</span>
                <input type="date" id="dateTo" class="date-input">
                <button id="applyCustom" class="btn-apply">Применить</button>
            </div>
        </div>

        <!-- Таблица товаров -->
        <div class="products-section">
            <div class="section-header">
                <h2>Товары</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Поиск по артикулу или названию" class="search-input">
                </div>
            </div>

            <div class="table-wrapper">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th class="col-photo">Фото</th>
                            <th class="col-article">Артикул</th>
                            <th class="col-name">Название</th>
                            <th class="col-number">Выручка</th>
                            <th class="col-number">Комиссия WB</th>
                            <th class="col-number">Логистика</th>
                            <th class="col-number">Хранение</th>
                            <th class="col-number">Штрафы</th>
                            <th class="col-number">Реклама</th>
                            <th class="col-number">Возвраты</th>
                            <th class="col-number">Прочее</th>
                            <th class="col-number">Себестоимость</th>
                            <th class="col-number profit-col">Прибыль</th>
                            <th class="col-number">ROI %</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable">
                        <tr>
                            <td colspan="14" class="loading">Загрузка...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
